{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header bg-primary text-white"><h4>Nouveau Livre</h4></div>
            <div class="card-body">
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Titre</label>
                        <input type="text" name="titre" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">ISBN</label>
                        <input type="text" name="isbn" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Date de Publication</label>
                        <input type="date" name="date_publication" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Auteur</label>
                        <select name="auteur" class="form-select" required>
                            <option value="">-- Choisir un auteur --</option>
                            {% for auteur in auteurs %}
                                <option value="{{ auteur.id }}">{{ auteur.nom }} {{ auteur.prenom }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Enregistrer</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
