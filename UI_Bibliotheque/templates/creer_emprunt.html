{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow border-0">
                <div class="card-header bg-success text-white py-3">
                    <h4 class="mb-0 text-center"><i class="bi bi-journal-plus"></i> Nouvel Emprunt</h4>
                </div>
                <div class="card-body p-4">
                    <form method="POST">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">Livre à emprunter</label>
                            <select name="livre" class="form-select" required>
                                <option value="" selected disabled>-- Choisir un livre --</option>
                                {% for livre in livres %}
                                    <option value="{{ livre.id }}">{{ livre.titre }} (ID: {{ livre.id }})</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Nom du lecteur</label>
                            <input type="text" name="nom_lecteur" class="form-control" placeholder="Entrez le nom de l'adhérent" required>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Date d'emprunt</label>
                                <input type="date" name="date_emprunt" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Date de retour</label>
                                <input type="date" name="date_retour" class="form-control" required>
                            </div>
                        </div>

                        <hr class="my-4">

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success fw-bold">
                                <i class="bi bi-check-circle"></i> Confirmer l'emprunt
                            </button>
                            <a href="{% url 'ui_emprunts' %}" class="btn btn-outline-secondary">
                                Annuler
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
